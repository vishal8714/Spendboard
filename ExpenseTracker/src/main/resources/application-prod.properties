# Production-only settings. Active when SPRING_PROFILES_ACTIVE=prod (set in the Dockerfile).

# Quieter, faster logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# The session cookie only travels over HTTPS
server.servlet.session.cookie.secure=true

# Trust X-Forwarded-For / X-Forwarded-Proto from Caddy (real visitor IPs, correct https URLs)
server.forward-headers-strategy=native

# Never send stack traces or internal messages to the browser
server.error.include-stacktrace=never
server.error.include-message=never