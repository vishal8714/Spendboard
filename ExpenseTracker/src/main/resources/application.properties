# Local secrets and machine settings (DB password, Google client, mail server) live in .env
spring.config.import=optional:file:.env[.properties]

spring.application.name=ExpenseTracker

# ---------- Database ----------
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.open-in-view=false

# ---------- Sessions (login) ----------
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Turn this on once the app is served over HTTPS (when it goes live)
# server.servlet.session.cookie.secure=true

# ---------- Email (verification codes) ----------
# The mail server is set in .env (spring.mail.host etc.).
# Without it, verification codes are printed in the backend log instead of emailed.
app.mail.from=Spendboard <no-reply@spendboard.local>

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=native
server.error.include-stacktrace=never
server.error.include-message=never